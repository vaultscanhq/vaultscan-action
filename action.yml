name: VaultScan GitHub Action
description: >-
  Gate pull requests with VaultScan: secrets, risky Terraform plans, Kubernetes
  manifests and CI workflows, reduced to one ALLOW / WARN / ASK HUMAN / BLOCK verdict.

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Directory to scan for secrets and workflows
    default: "."
  plan:
    description: Path to a Terraform plan in JSON form (terraform show -json). Optional.
    default: ""
  manifests:
    description: File or directory of Kubernetes manifests. Optional.
    default: ""
  policy:
    description: Path to a VaultScan policy file. Defaults to .vaultscan.yml in the scanned path if present.
    default: ""
  fail-on-findings:
    description: >-
      Fail the job when the verdict is ASK HUMAN or BLOCK. Set to "false" to report
      without failing, which matches how v1 of this action behaved.
    default: "true"
  version:
    description: Git ref of vaultscan-community to install (tag, branch or commit SHA)
    default: main
  ai:
    description: >-
      Add the AI review. Needs VAULTSCAN_AI_PROVIDER and VAULTSCAN_AI_MODEL (and an
      API key for hosted providers) in the job environment.
    default: "false"

outputs:
  verdict:
    description: ALLOW, WARN, ASK_HUMAN or BLOCK
    value: ${{ steps.gate.outputs.verdict }}
  report:
    description: Path to the JSON report
    value: ${{ steps.gate.outputs.report }}

runs:
  using: composite
  steps:
    # Installed with pip instead of cloned into the workspace: v1 cloned the
    # scanner next to the user's code and then scanned its own test fixtures.
    - name: Install VaultScan
      shell: bash
      env:
        VAULTSCAN_REF: ${{ inputs.version }}
      run: python3 -m pip install --quiet --disable-pip-version-check "git+https://github.com/vaultscanhq/vaultscan-community.git@${VAULTSCAN_REF}"

    - name: Run the gate
      id: gate
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PLAN: ${{ inputs.plan }}
        INPUT_MANIFESTS: ${{ inputs.manifests }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        INPUT_AI: ${{ inputs.ai }}
      run: '"${GITHUB_ACTION_PATH}/entrypoint.sh"'
